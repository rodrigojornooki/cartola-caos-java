# Configuração para produção Railway
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cartola_db}
spring.datasource.username=${DATABASE_USER:rodrigojornooki}
spring.datasource.password=${DATABASE_PASSWORD:suasenha}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Cartola Token
cartola.token=${CARTOLA_TOKEN:eyJhbGciOiJSUzI1NiIsImtpZCI6Ijg5NWIwYmIwLTI4ODMtNDE3MC1hMDY2LTZkMDIwZjkzNGRlMyIsInR5cCI6IkpXVCJ9....}

# CORS (permitir frontend)
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://*.netlify.app,https://*.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true